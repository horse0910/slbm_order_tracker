[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slbm-tracker"
version = "0.1.0"
description = "NSE Securities Lending & Borrowing Mechanism (SLBM) Order Tracker and Portfolio Manager"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Lead Engineer" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    # Required by FastAPI to parse multipart/form-data for the UploadFile CSV
    # import routes (portfolio + SLB report). Already pinned in requirements.txt;
    # listed here for install parity — NOT a new dependency.
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
